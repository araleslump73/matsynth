<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatSynth Remote</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #121212; color: #e0e0e0; font-family: sans-serif; }
        .card { background: #1e1e1e; border: 1px solid #333; margin-bottom: 15px; }
        .slider-label { font-size: 0.8rem; color: #00ff88; margin-bottom: 2px; display: block; }
        .form-select { background-color: #2a2a2a; color: white; border: 1px solid #444; }
        .form-select:focus { background-color: #333; color: white; }
    </style>
</head>
<body class="container py-3">
    <h3 class="text-center text-success mb-3">MatSynth Control</h3>

    <div class="d-grid mb-3">
        <button class="btn btn-warning fw-bold" onclick="syncWithSynth()">🔄 AGGIORNA STATO DA TASTIERA</button>
    </div>

    <div class="card p-3">
        <label class="slider-label text-white">CANALE MIDI ATTIVO</label>
        <select id="chan_select" class="form-select mb-3" onchange="syncWithSynth()">
            {% for i in range(16) %}
            <option value="{{ i }}">Canale {{ i + 1 }}</option>
            {% endfor %}
        </select>

        <label class="slider-label text-white">SELEZIONA STRUMENTO (SF2)</label>
        <select id="inst_dropdown" class="form-select" onchange="changeInstrument(this.value)">
            <option>Caricamento strumenti...</option>
        </select>
        
        <div id="status_info" class="mt-2 small text-info text-truncate">Pronto.</div>
    </div>

    <div class="card p-3">
        <div class="row">
            <div class="col-6 mb-3">
                <label class="slider-label">ATTACK (CC 73)</label>
                <input type="range" class="form-range" min="0" max="127" value="64" onchange="sendCC(73, this.value)">
            </div>
            <div class="col-6 mb-3">
                <label class="slider-label">RELEASE (CC 72)</label>
                <input type="range" class="form-range" min="0" max="127" value="64" onchange="sendCC(72, this.value)">
            </div>
            <div class="col-6">
                <label class="slider-label">CUTOFF (CC 74)</label>
                <input type="range" class="form-range" min="0" max="127" value="127" onchange="sendCC(74, this.value)">
            </div>
            <div class="col-6">
                <label class="slider-label">RESO (CC 71)</label>
                <input type="range" class="form-range" min="0" max="127" value="0" onchange="sendCC(71, this.value)">
            </div>
        </div>
    </div>

    <div class="card p-3">
        <label class="slider-label">RIVERBERO</label>
        <input type="range" class="form-range mb-2" min="0" max="1" step="0.05" onchange="setEff('reverb.level', this.value)">
        <label class="slider-label">CHORUS</label>
        <input type="range" class="form-range" min="0" max="1" step="0.05" onchange="setEff('chorus.level', this.value)">
    </div>

<script>
    // Funzione universale per inviare comandi CC (Attack, Release, ecc.)
    function sendCC(cc, val) {
        const chan = document.getElementById('chan_select').value;
        fetch(`/cc/${chan}/${cc}/${val}`);
    }

    // Funzione per gli effetti (Riverbero, Chorus)
    function setEff(type, val) {
        fetch(`/set_effect/${type}/${val}`);
    }
async function loadInstruments() {
    console.log("--- Inizio caricamento strumenti ---");
    try {
        const res = await fetch('/get_instruments');
        const data = await res.json();
        
        console.log("Dati JSON ricevuti dal server:", data);
        console.log("Numero totale righe:", data.length);

        const dropdown = document.getElementById('inst_dropdown');
        dropdown.innerHTML = '<option value="">Scegli uno strumento...</option>';
        
        let contatore = 0;

        data.forEach((inst, index) => {
            // Debug riga per riga (utile per vedere dove si ferma)
            console.log(`Analisi riga [${index}]: "${inst}"`);

            if (!inst || !inst.includes('-')) {
                console.warn(`Riga [${index}] scartata (manca il trattino)`);
                return;
            }

            try {
                const parts = inst.split('-');
                const bank = parts[0].trim();
                const rest = parts[1].trim();
                const progNum = rest.split(' ')[0];
                
                let opt = document.createElement('option');
                opt.value = bank + "," + progNum;
                opt.innerText = inst;
                dropdown.appendChild(opt);
                contatore++;
            } catch (err) {
                console.error(`ERRORE CRITICO alla riga [${index}]:`, err);
            }
        });

        console.log(`--- Fine caricamento. Inseriti ${contatore} strumenti ---`);

    } catch(e) {
        console.error("Errore fatale nella fetch:", e);
    }
}
    // Funzione chiamata quando cambi strumento dal menu
    function changeInstrument(val) {
        if (!val) return;
        const chan = document.getElementById('chan_select').value;
        const [bank, prog] = val.split(',');
        const dropdown = document.getElementById('inst_dropdown');
        const name = dropdown.options[dropdown.selectedIndex].text;

        // Aggiorniamo lo stato visivo
        document.getElementById('status_info').innerText = `Invio: ${name}...`;

        // Modifichiamo la chiamata per gestire anche il banco (opzionale ma consigliato)
        fetch(`/select_prog/${chan}/${prog}`); 
        
        // Se vuoi gestire anche i banchi (es. i Drumkit al 120/128),
        // dovremmo aggiornare app.py per accettare il banco.
    }

    // Sincronizza lo stato leggendo da FluidSynth
    async function syncWithSynth() {
        const infoBox = document.getElementById('status_info');
        infoBox.innerText = "Sincronizzazione...";
        try {
            const res = await fetch('/refresh_status');
            const data = await res.json();
            const currentChan = document.getElementById('chan_select').value;
            
            const lines = data.raw.split('\n');
            let found = false;
            lines.forEach(line => {
                // Cerca la riga del canale (es: "chan 0, bank 0, prog 5, FM Electric Piano")
                if (line.includes(`chan ${currentChan},`) || line.includes(`chan ${currentChan} `)) {
                    const parts = line.split(',');
                    const instName = parts[parts.length - 1].trim();
                    infoBox.innerText = "Attivo: " + instName;
                    found = true;
                }
            });
            if(!found) infoBox.innerText = "Nessun dato per questo canale.";
        } catch(e) {
            infoBox.innerText = "Errore sincronizzazione.";
        }
    }

    // Carica tutto all'avvio
    window.onload = loadInstruments;
</script>
</body>
</html>
